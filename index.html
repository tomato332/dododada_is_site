<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tomato332</title>
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/theme/darcula.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css?v=2">
</head>
<body>
    <div id="cursor-glow"></div>
    <canvas id="weather-canvas"></canvas>

    <!-- Header -->
    <div class="header" id="header">
        <div class="header-left">
            <img class="avatar" src="https://avatars.githubusercontent.com/tomato332" alt="" />
            <span class="name">tomato332</span>
        </div>
        <div class="header-center">
            <span id="headerClock"></span>
        </div>
        <div class="header-right">
            <div class="theme-dropdown-wrap">
                <button class="theme-btn" id="headerThemeBtn" onclick="toggleTheme()" data-tip="Theme & Weather" data-tip-pos="bottom" aria-label="Toggle theme">🌙</button>
                <div class="weather-dropdown">
                    <div class="weather-dropdown-row">
                        <span class="weather-dropdown-label">WEATHER</span>
                        <div style="display:flex;gap:4px;">
                            <button class="weather-item-btn" id="weatherClearBtn" title="Clear">☀️</button>
                            <button class="weather-item-btn" id="weatherRainBtn" title="Rain">🌧</button>
                            <button class="weather-item-btn" id="weatherSnowBtn" title="Snow">❄️</button>
                        </div>
                    </div>
                    <div class="weather-dropdown-row">
                        <span class="weather-dropdown-label">THUNDER</span>
                        <button class="weather-item-btn" id="weatherThunderToggleBtn">⚡ OFF</button>
                    </div>
                </div>
            </div>
            <div class="header-bgm">
                <button id="pomodoroBtn" class="header-bgm-btn" data-tip="Timer & Todo" data-tip-pos="bottom">🍅</button>
                <button id="bgmBtn" class="header-bgm-btn" data-tip="BGM Player" data-tip-pos="bottom">🎵</button>
            </div>
        </div>
    </div>

    <!-- BGM Player Panel -->
    <div id="bgm-player" class="bgm-player">
        <div class="bgm-player-inner">
            <div class="bgm-player-track">
                <span id="bgmTrackName">🌤 Chill Day</span>
            </div>
            <div class="bgm-player-controls">
                <button id="bgmMuteBtn" class="bgm-player-btn" data-tip="Mute / Unmute">🔇</button>
                <div class="bgm-volume-wrap">
                    <input type="range" id="bgmVolume" class="bgm-volume-slider" min="0" max="100" value="70">
                </div>
                <select id="bgmSelect" class="bgm-select"></select>
            </div>
            <div class="bgm-player-notice" id="bgmNotice">📻 Radio streams may contain ads</div>
            <div id="seq-wrapper" class="seq-wrapper">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;padding:0 2px;">
                    <div style="font-family:'Press Start 2P',monospace;font-size:.4rem;color:var(--muted);letter-spacing:2px;">STEP SEQUENCER</div>
                    <div style="display:flex;gap:3px;">
                        <button id="seqResetBtn" class="seq-reset-btn" data-tip="Reset Pattern">↺</button>
                        <button id="seqSaveBtn" class="seq-reset-btn" data-tip="Save Slot">💾</button>
                        <button id="seqShareBtn" class="seq-reset-btn" data-tip="Copy Code">📋</button>
                        <button id="seqImportBtn" class="seq-reset-btn" data-tip="Import Code">📂</button>
                    </div>
                </div>
                <div id="seq-container" class="seq-container"></div>
                <div id="seqSlotsList" class="seq-slots-list"></div>
            </div>
        </div>
    </div>

    <!-- Pomodoro & Todo/Calendar Panel -->
    <div id="pomodoro-player" class="pomodoro-player">
        <div class="pomodoro-player-inner">
            <div class="pomodoro-player-header">
                <span class="pomodoro-player-icon">🍅</span>
                <span class="pomodoro-player-title">POMODORO & TODO</span>
            </div>
            
            <!-- Timer Section -->
            <div class="pomodoro-player-body">
                <span class="pomodoro-mode" id="pomodoroMode">FOCUS</span>
                <span class="pomodoro-display" id="pomodoroDisplay">25:00</span>
                <div class="pomodoro-player-controls">
                    <button class="pomodoro-btn" id="pomodoroStart" data-tip="Start / Pause">▶</button>
                    <button class="pomodoro-btn" id="pomodoroReset" data-tip="Reset Timer">↺</button>
                </div>
                <div class="pomodoro-player-sessions" id="pomodoroSessions">SESSIONS: 0</div>
            </div>

            <!-- Calendar & Todo Section -->
            <div class="tc-container">
                <!-- Calendar Section -->
                <div class="cal-section">
                    <div class="cal-header">
                        <button class="cal-nav-btn" id="calPrevBtn" data-tip="Prev Month">◀</button>
                        <span class="cal-title" id="calTitle"></span>
                        <div class="cal-nav-group">
                            <select id="calCountrySelect" class="cal-country-select" data-tip="Select Country">
                                <option value="KR">🇰🇷 KR</option>
                                <option value="US">🇺🇸 US</option>
                                <option value="JP">🇯🇵 JP</option>
                                <option value="GB">🇬🇧 GB</option>
                                <option value="DE">🇩🇪 DE</option>
                                <option value="FR">🇫🇷 FR</option>
                                <option value="CA">🇨🇦 CA</option>
                                <option value="AU">🇦🇺 AU</option>
                            </select>
                            <button class="cal-nav-btn" id="calTodayBtn" data-tip="Jump to Today">TODAY</button>
                            <button class="cal-nav-btn" id="calNextBtn" data-tip="Next Month">▶</button>
                        </div>
                    </div>
                    <div class="cal-grid">
                        <div class="cal-day-name">SU</div>
                        <div class="cal-day-name">MO</div>
                        <div class="cal-day-name">TU</div>
                        <div class="cal-day-name">WE</div>
                        <div class="cal-day-name">TH</div>
                        <div class="cal-day-name">FR</div>
                        <div class="cal-day-name">SA</div>
                    </div>
                    <div class="cal-grid" id="calGridDays"></div>
                </div>

                <!-- Todo Section -->
                <div class="todo-section">
                    <div class="todo-header-wrap">
                        <div class="todo-date-title" id="todoDateTitle">TODO</div>
                        <div class="todo-holiday-badge" id="todoHolidayBadge" style="display:none;"></div>
                    </div>
                    <div class="todo-input-wrap">
                        <input type="text" id="todoInput" class="todo-input" placeholder="New task..." />
                        <button id="todoAddBtn" class="todo-add-btn" data-tip="Add Task">+</button>
                    </div>
                    <div class="todo-list" id="todoList"></div>
                </div>
            </div>
        </div>
    </div>
    <div id="repos-overlay"></div>
    <div id="repos-panel">
        <button class="close-btn" id="closeReposBtn">✕</button>
        <div class="section-title">Repositories</div>
        <div class="repos-user-input-wrap">
            <input type="text" id="repos-username-input" class="repos-user-input" placeholder="GitHub username..." />
            <button id="repos-load-btn" class="repos-load-btn">Load</button>
        </div>
        <div class="loading" id="loading">Loading...</div>
        <div id="content"></div>
    </div>

    <!-- Hero -->
    <div class="hero" id="hero">
        <div class="avatar-wrap">
            <img class="avatar" src="https://avatars.githubusercontent.com/tomato332" alt="tomato332" />
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
            <div class="name">tomato332</div>
            <button class="header-toggle" id="toggleReposBtn" data-tip="GitHub Repos" data-tip-pos="bottom">▾ repos</button>
        </div>
        <div class="hero-links">
            <a href="https://github.com/tomato332" target="_blank">github</a>
            <div class="hero-game-dropdown-wrap">
                <a href="game/index.html" target="_blank">game ▾</a>
                <div class="hero-game-dropdown">
                    <a href="game/index.html" target="_blank">🎯 Archer Master</a>
                    <a href="clicker.html">🍅 Tomato Clicker & Shop</a>
                </div>
            </div>
        </div>
        <div class="stats">
            <img src="https://github-readme-stats-anuraghazra1.vercel.app/api?username=tomato332&show_icons=true&theme=dark&bg_color=0d1117&border_color=30363d&text_color=c9d1d9&icon_color=58a6ff" alt="GitHub Stats" />
        </div>
    </div>

    <!-- Floating shop panel (For background effect support) -->
    <div id="shop-overlay" style="display:none;"></div>
    <div id="shop-panel" style="display:none;">
        <div id="shop-balance"></div>
        <div id="shop-items"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/htmlmixed/htmlmixed.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/clike/clike.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/shell/shell.min.js"></script>
    <script type="module" src="src/main.js?v=2"></script>
</body>
</html>
